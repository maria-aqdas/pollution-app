<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CityAir - Pollution Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
:root{--bg:#16181b;--fg:#eef0f1;--mut:#a3a9ad;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--ac:#e8a93a}
[data-theme=light]{--bg:#f6f3ec;--fg:#1c1d1f;--mut:#5d6266;--card:rgba(0,0,0,.04);--bd:rgba(0,0,0,.12);--ac:#c88510}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Comic Sans MS','Comic Sans','Comic Neue',cursive;min-height:100vh;overflow-x:hidden}
[dir=rtl] body{font-family:'Noto Nastaliq Urdu',serif;line-height:2.1}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg:before{content:"";position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,var(--ac),transparent 65%);opacity:.2;animation:mv 18s ease-in-out infinite alternate}
.bg:after{content:"";position:absolute;inset:-60px;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:60px 60px;animation:gr 12s linear infinite;opacity:.6}
@keyframes mv{0%{top:-20%;left:-10%}100%{top:40%;left:55%}}
@keyframes gr{to{transform:translate(60px,60px)}}
.wrap{max-width:1000px;margin:auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font-weight:800;font-size:22px}.logo b{color:var(--ac)}
.tools button{background:var(--card);border:1px solid var(--bd);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer;margin-inline-start:8px;font:inherit;font-size:14px}
.tag{color:var(--mut);letter-spacing:.2em;font-size:12px;text-transform:uppercase;margin-top:40px}
h1{font-size:clamp(36px,7vw,68px);line-height:1.1;margin:12px 0;font-weight:800}
h1 span{color:var(--ac)}
.sub{color:var(--mut);font-size:18px;max-width:640px}
form{display:flex;gap:10px;margin:26px 0;flex-wrap:wrap}
input{flex:1;min-width:200px;padding:15px 18px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:16px}
.go{background:linear-gradient(#f3c25c,#d99a2b);color:#1a1a1a;border:0;padding:15px 26px;border-radius:12px;font-weight:700;cursor:pointer;font:inherit;font-weight:700}
#status{color:var(--mut);margin:10px 0}
.top{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin:30px 0 10px}
.gauge{position:relative;width:150px;height:150px}.gauge svg{transform:rotate(-90deg)}
.gauge .n{position:absolute;inset:0;display:grid;place-items:center;font-size:36px;font-weight:800}
.live{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.pill{background:var(--card);border:1px solid var(--bd);padding:6px 12px;border-radius:99px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}
.chip{background:var(--card);border:1px solid var(--bd);color:var(--fg);padding:8px 16px;border-radius:99px;cursor:pointer;font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:#1a1a1a;border-color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.grid.one{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;cursor:pointer;backdrop-filter:blur(6px)}
.card h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;color:var(--mut);border:1px solid var(--bd);padding:2px 8px;border-radius:99px;font-weight:400}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%}
.card p{color:var(--mut);margin:8px 0}
.card h4{margin:16px 0 2px;color:var(--ac)}
.fc{display:flex;gap:10px;align-items:flex-end;height:120px;margin-top:10px}
.fc div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.fc i{display:block;border-radius:6px 6px 0 0;margin-bottom:4px}
footer{color:var(--mut);font-size:13px;padding:40px 0}
html{scroll-behavior:smooth}
.links a{color:var(--mut);text-decoration:none;margin-inline-end:18px;font-size:14px}.links a:hover{color:var(--ac)}
@media(max-width:760px){.links{display:none}}
section{margin-top:80px}
.sh{font-size:clamp(26px,4vw,40px);margin:0 0 6px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:60px}
.stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;color:var(--mut)}
.stat b{display:block;font-size:32px;color:var(--ac)}
.card.lc{cursor:default}
.card.lc:hover{border-color:var(--ac)}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin:10px 0}
summary{cursor:pointer;font-weight:600}
.card ul{margin:10px 0;padding-inline-start:22px}.card li{margin:8px 0;line-height:1.5}
.adv{display:grid;gap:10px;margin:18px 0}
.al{padding:14px 18px;border-radius:12px;border:1px solid var(--bd);border-inline-start:6px solid;background:var(--card)}
.al.r{border-inline-start-color:#e5484d}.al.o{border-inline-start-color:#f08a3c}.al.y{border-inline-start-color:#e8c23a}.al.g{border-inline-start-color:#3fb97a}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:16px 0}
.cv{position:relative;height:300px}
@media print{.bg,nav,form,#tags,.chips,#more,footer,button,.links{display:none!important}
html[data-theme]{--fg:#000;--mut:#333;--card:#fff;--bd:#bbb;--bg:#fff}
.card,.al,.top{break-inside:avoid}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <nav>
    <div class="logo">City<b>Air</b></div>
    <div class="links"></div>
    <div class="tools"><button id="lg">اردو</button><button id="th">Light</button></div>
  </nav>
  <div class="tag" data-t="tag"></div>
  <h1 id="h1"></h1>
  <p class="sub" data-t="sub"></p>
  <form id="f"><input id="q" autocomplete="off"><input id="q2" autocomplete="off"><button class="go" data-t="btn"></button><button type="button" class="chip" id="loc"></button></form>
  <div class="chips" id="tags"></div>
  <div id="status"></div>
  <div id="out"></div>
  <div id="more"></div>
  <footer data-t="foot"></footer>
</div>

ur:{tag:'کسی بھی شہر کی آلودگی چیک کریں',h1:'آپ کا <span>شہر</span> کتنا صاف ہے؟',sub:'کسی بھی شہر کا نام لکھیں اور ہوا، پانی، حرارت، زمین، شور، روشنی اور تابکاری کی آلودگی، اس کے نقصانات اور اگلے 5 سال کا اندازہ آسان الفاظ میں دیکھیں۔',btn:'شہر چیک کریں',ph:'شہر کا نام لکھیں، مثلاً لاہور',load:'چیک ہو رہا ہے... چند سیکنڈ لگیں گے',all:'سب',overall:'مجموعی آلودگی',causes:'یہ کیوں ہوتی ہے',harm:'نقصانات',fc:'اگلے 5 سال (زیادہ = بدتر)',tip:'آپ کیا کر سکتے ہیں',live:'لائیو ڈیٹا',est:'AI اندازہ',aqi:'ہوا کا معیار',temp:'درجہ حرارت',foot:'ہوا اور درجہ حرارت لائیو ڈیٹا ہے۔ پانی، زمین، شور، روشنی اور تابکاری AI کے اندازے ہیں، سرکاری پیمائش نہیں۔',light:'لائٹ',dark:'ڈارک',tap:'تفصیل کے لیے کارڈ دبائیں',out:'اگلے 5 سال میں کیا ہو سکتا ہے',steps:'بہتری کے اقدامات',ld:'تفصیل لوڈ ہو رہی ہے...',ph2:'موازنے کے لیے شہر (اختیاری)',loc:'📍 میرا مقام',rad:'ساتوں آلودگیاں ایک نظر میں',hist:'ہوا کا معیار: پچھلے 7 دن',dl:'رپورٹ ڈاؤن لوڈ کریں (PDF)',cleaner:'مجموعی طور پر زیادہ صاف ہے',up:'بڑھ رہی ہے: حالات خراب ہو رہے ہیں',dn:'کم ہو رہی ہے: حالات بہتر ہو رہے ہیں',fl:'تقریباً ویسی ہی رہے گی',
hn:(p,d)=>d>5?`آج کی ہوا پچھلے 6 دن کی اوسط سے ${p}% زیادہ خراب ہے۔`:d<-5?`آج کی ہوا پچھلے 6 دن کی اوسط سے ${p}% بہتر ہے۔`:`آج کی ہوا پچھلے 6 دن جیسی ہی ہے۔`,
adv:{noout:'🚫 آج بچوں، بزرگوں اور بیمار لوگوں کے لیے باہر جانا محفوظ نہیں۔ گھر کے اندر رہیں۔',mask:'😷 باہر جائیں تو آج ماسک ضرور پہنیں۔',water:'💧 پانی ابال کر پئیں۔',heat:'🥵 آج بہت گرمی ہے۔ زیادہ پانی پئیں اور دوپہر کی دھوپ سے بچیں۔',noise:'🔊 شور بہت زیادہ ہے۔ اپنے کانوں اور نیند کا خیال رکھیں۔',ok:'✅ آج حالات ٹھیک ہیں۔ باہر کا لطف اٹھائیں۔'},

const K=['air','water','thermal','land','noise','light','radioactive'];
let lang='en',data=null,sel='all',det={},data2=null,CH={};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=s=>s<25?'#3fb97a':s<50?'#e8c23a':s<75?'#f08a3c':'#e5484d';
const C={
en:{nv:['Check city','Why it matters','How it works','FAQ'],ls:'What every person should know about each type of pollution',
st:[['7','Pollution types'],['Live','Air data'],['2','Languages'],['Free','To use']],
l:{air:'Dirty air carries tiny particles (PM2.5) deep into your lungs and blood. It causes asthma, heart disease and shorter life, and children and the elderly suffer most.',
water:'Unsafe water spreads diarrhea, typhoid and cholera, and poisons crops and fish. Water pollution is often invisible and has no smell.',
thermal:'Heat from cities, factories and power plants warms air and water. It causes heatstroke, higher power bills and kills river life.',
land:'Waste, chemicals and plastic in soil poison the food we grow and the groundwater below. Polluted land stays harmful for years.',
noise:'Constant loud noise raises stress and blood pressure, ruins sleep and can damage hearing and children\'s learning.',
light:'Too much night lighting disrupts sleep, confuses birds and insects, and hides the stars.',
radioactive:'Radiation from waste or accidents can cause cancer and damage DNA. Normal city levels are low, but safe storage of waste matters.'},
h:[['Type a city','Enter any city in the world.'],['We fetch live data','Air quality and temperature come live from Open-Meteo.'],['AI explains it','Gemini estimates the rest and explains it in simple words, in English or Urdu.']],

['What does the score mean?','0 is very clean and 100 is very polluted. Green is safe, yellow is moderate, orange is unhealthy and red is dangerous.'],
['How is the 5-year forecast made?','The AI projects each score from current conditions and general trends. It is an informed guess, not a promise.'],
['What can I do?','Wear a mask on bad air days, save electricity and water, never burn waste, plant trees and report pollution to the local authorities.']]},
ur:{nv:['شہر چیک کریں','یہ کیوں اہم ہے','یہ کیسے کام کرتا ہے','سوالات'],ls:'ہر قسم کی آلودگی کے بارے میں ہر شخص کو کیا جاننا چاہیے',
st:[['7','آلودگی کی اقسام'],['لائیو','ہوا کا ڈیٹا'],['2','زبانیں'],['مفت','استعمال کے لیے']],
l:{air:'آلودہ ہوا کے باریک ذرات (PM2.5) پھیپھڑوں اور خون تک پہنچ جاتے ہیں۔ اس سے دمہ، دل کی بیماری اور عمر میں کمی ہوتی ہے، اور بچے اور بزرگ سب سے زیادہ متاثر ہوتے ہیں۔',
water:'ناصاف پانی سے اسہال، ٹائیفائیڈ اور ہیضہ پھیلتا ہے اور فصلیں اور مچھلیاں بھی زہریلی ہو جاتی ہیں۔ پانی کی آلودگی اکثر نظر نہیں آتی۔',

function more(){
  const c=C[lang],n=T[lang].n,E={air:'🌫️',water:'💧',thermal:'🔥',land:'🌱',noise:'🔊',light:'💡',radioactive:'☢️'};
  $('.links').innerHTML=['f','learn','how','faq'].map((h,i)=>`<a href="#${h}">${c.nv[i]}</a>`).join('');
  $('#more').innerHTML=`<div class="stats">${c.st.map(s=>`<div class="stat"><b>${s[0]}</b>${s[1]}</div>`).join('')}</div>
  <section id="learn"><h2 class="sh">${c.nv[1]}</h2><p class="sub">${c.ls}</p><div class="grid" style="margin-top:20px">${K.map(k=>`<div class="card lc"><h3>${E[k]} ${n[k]}</h3><p>${c.l[k]}</p></div>`).join('')}</div></section>
  <section id="how"><h2 class="sh">${c.nv[2]}</h2><div class="grid">${c.h.map((s,i)=>`<div class="card lc"><span style="font-size:34px;font-weight:800;color:var(--ac)">${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('')}</div></section>
  <section id="faq"><h2 class="sh">${c.nv[3]}</h2>${c.f.map(q=>`<details><summary>${q[0]}</summary><p style="color:var(--mut)">${q[1]}</p></details>`).join('')}</section>`;
}
function ui(){
  const t=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang=='ur'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  $('#q').placeholder=t.ph;$('#q2').placeholder=t.ph2;$('#loc').textContent=t.loc;tags();$('#h1').innerHTML=t.h1;
  $('#lg').textContent=lang=='en'?'اردو':'English';
  const dk=document.documentElement.dataset.theme=='dark';
  $('#th').textContent=dk?t.light:t.dark;
  more();
  render();
}
function recent(){try{return JSON.parse(localStorage.getItem('rc')||'[]')}catch(e){return[]}}
function remember(c){try{localStorage.setItem('rc',JSON.stringify([c,...recent().filter(x=>x!=c)].slice(0,5)))}catch(e){}tags();}
function tags(){const L=[...new Set([...recent(),'Lahore','Karachi','Delhi','London','Tokyo'])].slice(0,9);$('#tags').innerHTML=L.map(c=>`<button type="button" class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('');}
function advice(a,L){const o=a.overall.score,I=a.items,A=T[lang].adv,out=[];
  if(o>=75||I.air.score>=60)out.push(['r',A.noout]);
  if(I.air.score>=40)out.push(['o',A.mask]);
  if(I.water.score>=50)out.push(['o',A.water]);
  if((L.temp??0)>=35)out.push(['o',A.heat]);
  if(I.noise.score>=70)out.push(['y',A.noise]);
  if(!out.length)out.push(['g',A.ok]);
  return out;}
function histNote(d){const h=d.history.map(x=>x.v),avg=h.slice(0,-1).reduce((s,v)=>s+v,0)/Math.max(1,h.length-1)||1,cur=d.live.aqi??h[h.length-1],df=Math.round((cur-avg)/avg*100);return T[lang].hn(Math.abs(df),df);}
function extras(a,L,t){
  let h=`<div class="adv">${advice(a,L).map(x=>`<div class="al ${x[0]}">${x[1]}</div>`).join('')}</div><button class="go" onclick="window.print()">⬇ ${t.dl}</button>
  <div class="two"><div class="card lc"><h3>${t.rad}</h3><div class="cv"><canvas id="rad"></canvas></div></div>`
  +(data.history&&data.history.length>1?`<div class="card lc"><h3>${t.hist}</h3><div class="cv"><canvas id="his"></canvas></div><p>${histNote(data)}</p></div>`:'')+`</div>`;
  if(data2){const b=data2.ai;h+=`<div class="card lc"><h3>${esc(data.city)} vs ${esc(data2.city)}</h3>`+K.map(k=>`<p>${t.n[k]}: <b style="color:${col(a.items[k].score)}">${Math.round(a.items[k].score)}</b> vs <b style="color:${col(b.items[k].score)}">${Math.round(b.items[k].score)}</b></p>`).join('')+`<p><b>${esc(a.overall.score<=b.overall.score?data.city:data2.city)}</b> ${t.cleaner}</p></div>`;}
  return h;}
function mk(id,c){const e=document.getElementById(id);if(!e)return;if(CH[id])CH[id].destroy();CH[id]=new Chart(e,c);}
function draw(){
  if(typeof Chart=='undefined')return;
  Chart.defaults.font.family="'Comic Sans MS','Comic Neue',cursive";
  const t=T[lang],a=data.ai,cs=getComputedStyle(document.documentElement),m=cs.getPropertyValue('--mut').trim(),g=cs.getPropertyValue('--bd').trim(),ax={ticks:{color:m},grid:{color:g}};
  const ds=[{label:data.city,data:K.map(k=>a.items[k].score),borderColor:'#e8a93a',backgroundColor:'rgba(232,169,58,.25)'}];
  if(data2)ds.push({label:data2.city,data:K.map(k=>data2.ai.items[k].score),borderColor:'#4aa8ff',backgroundColor:'rgba(74,168,255,.2)'});
  mk('rad',{type:'radar',data:{labels:K.map(k=>t.n[k]),datasets:ds},options:{maintainAspectRatio:false,scales:{r:{min:0,max:100,ticks:{color:m,backdropColor:'transparent'},grid:{color:g},angleLines:{color:g},pointLabels:{color:m}}},plugins:{legend:{labels:{color:m}}}}});
  if(data.history&&data.history.length>1)mk('his',{type:'line',data:{labels:data.history.map(x=>x.d.slice(5)),datasets:[{label:'US AQI',data:data.history.map(x=>x.v),borderColor:'#e5484d',tension:.3}]},options:{maintainAspectRatio:false,scales:{x:ax,y:ax},plugins:{legend:{display:false}}}});
  if(sel!='all'){const y=new Date().getFullYear(),f=a.items[sel].forecast;mk('fcc',{type:'line',data:{labels:f.map((_,j)=>y+j+1),datasets:[{label:t.n[sel],data:f,borderColor:col(f[4]),backgroundColor:'rgba(232,169,58,.15)',fill:true,tension:.3}]},options:{maintainAspectRatio:false,scales:{y:{min:0,max:100,ticks:{color:m},grid:{color:g}},x:ax},plugins:{legend:{display:false}}}});}
}
function render(){
  if(!data)return;
  const t=T[lang],a=data.ai,L=data.live,o=a.overall,c=col(o.score),R=60,C=2*Math.PI*R;
  let h=`<div class="top"><div class="gauge"><svg width="150" height="150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="${c}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*o.score/100} ${C}"/></svg><div class="n">${Math.round(o.score)}</div></div>
  <div><h2 style="margin:0">${esc(data.city)}, ${esc(data.country)}</h2><div style="color:var(--mut)">${t.overall}: ${esc(o.verdict[lang])}</div>
  <div class="live"><span class="pill">${t.aqi}: ${L.aqi??'-'}</span><span class="pill">PM2.5: ${L.pm25??'-'}</span><span class="pill">${t.temp}: ${L.temp??'-'}°C</span></div></div></div>`;
  h+=extras(a,L,t)+`<div class="chips"><button class="chip ${sel=='all'?'on':''}" data-k="all">${t.all}</button>`+K.map(k=>`<button class="chip ${sel==k?'on':''}" data-k="${k}">${t.n[k]}</button>`).join('')+`</div>`;
  const list=sel=='all'?K:[sel];
  h+=`<div class="grid ${sel=='all'?'':'one'}">`+list.map(k=>{
    const i=a.items[k],s=i.score,cc=col(s),full=sel!='all';
    let x=`<div class="card" data-k="${k}"><h3>${t.n[k]}<span class="badge">${k=='air'?t.live:t.est}</span></h3>
    <b style="color:${cc}">${esc(i.level[lang])} · ${Math.round(s)}/100</b><div class="bar"><i style="width:${s}%;background:${cc}"></i></div>${ul(i.points[lang])}`;
    if(full){
      const y=new Date().getFullYear(),d=det[k];
      x+=`<h4>${t.fc}</h4><div class="cv" style="height:240px"><canvas id="fcc"></canvas></div><p><b>${i.forecast[4]>i.forecast[0]?'📈 '+t.up:i.forecast[4]<i.forecast[0]?'📉 '+t.dn:'➡️ '+t.fl}</b></p>`;
      x+=d?`<h4>${t.causes}</h4>${ul(d.causes[lang])}<h4>${t.harm}</h4>${ul(d.harm[lang])}<h4>${t.out}</h4>${ul(d.outlook[lang].map((z,j)=>'<b>'+(y+j+1)+':</b> '+esc(z)),1)}<h4>${t.steps}</h4>${ul(d.steps[lang])}`:`<p>${t.ld}</p>`;
    }else x+=`<small style="color:var(--mut)">${t.tap}</small>`;
    return x+'</div>';
  }).join('')+'</div>';
  $('#out').innerHTML=h;draw();
}
$('#out').addEventListener('click',async e=>{
  const b=e.target.closest('[data-k]');if(!b)return;sel=b.dataset.k;render();
  if(sel!='all'&&!det[sel]){const k=sel;
    try{const r=await fetch('/api/city?city='+encodeURIComponent(data.city)+'&type='+k);const d=await r.json();if(!r.ok)throw new Error(d.error);det[k]=d.ai;$('#status').textContent='';}
    catch(err){$('#status').textContent='Error: '+err.message;}
    render();}
});
$('#lg').onclick=()=>{lang=lang=='en'?'ur':'en';ui();};
$('#th').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark';ui();};
async function load(q){const r=await fetch('/api/city?city='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw new Error(d.error);return d;}
$('#f').onsubmit=async e=>{
  e.preventDefault();const q=$('#q').value.trim(),q2=$('#q2').value.trim();if(!q)return;
  $('#status').textContent=T[lang].load;$('#out').innerHTML='';sel='all';det={};data2=null;
  try{[data,data2]=await Promise.all([load(q),q2?load(q2):null]);$('#status').textContent='';remember(q);render();}
  catch(err){$('#status').textContent='Error: '+err.message;}
};
$('#tags').onclick=e=>{const b=e.target.closest('[data-c]');if(b){$('#q').value=b.dataset.c;$('#q2').value='';$('#f').requestSubmit();}};
$('#loc').onclick=()=>{
  if(!navigator.geolocation){$('#status').textContent='Location is not supported on this device';return;}
  $('#status').textContent=T[lang].load;
  navigator.geolocation.getCurrentPosition(async p=>{
    try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&localityLanguage=en`);const d=await r.json();const c=d.city||d.locality||d.principalSubdivision;if(!c)throw 0;$('#q').value=c;$('#q2').value='';$('#f').requestSubmit();}
    catch(e){$('#status').textContent='Could not find your city';}
  },()=>{$('#status').textContent='Location permission was denied';});
};
ui();
</script>
</body>
</html>
